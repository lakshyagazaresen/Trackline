name: Build and deploy ASP.Net Core app to Azure Web App - trackline-dev-api

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/main_trackline-dev-api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore API
        run: dotnet restore server/Trackline.Api/Trackline.Api.csproj

      - name: Build API
        run: >
          dotnet build
          server/Trackline.Api/Trackline.Api.csproj
          --configuration Release
          --no-restore

      - name: Publish API
        run: >
          dotnet publish
          server/Trackline.Api/Trackline.Api.csproj
          --configuration Release
          --no-build
          --output ./publish

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'trackline-dev-api'
          slot-name: 'Production'
          package: ./publish
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_086F406BB4D7471CACE7D0EB236BF8FF }}