name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: >
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.action != 'closed'
      )

    runs-on: ubuntu-latest
    name: Build and Deploy Job

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate frontend environment
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ENTRA_TENANT_SUBDOMAIN: ${{ secrets.VITE_ENTRA_TENANT_SUBDOMAIN }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ secrets.VITE_ENTRA_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ secrets.VITE_ENTRA_API_SCOPE }}
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "VITE_API_BASE_URL is missing"; exit 1; }
          test -n "$VITE_ENTRA_TENANT_SUBDOMAIN" || { echo "VITE_ENTRA_TENANT_SUBDOMAIN is missing"; exit 1; }
          test -n "$VITE_ENTRA_SPA_CLIENT_ID" || { echo "VITE_ENTRA_SPA_CLIENT_ID is missing"; exit 1; }
          test -n "$VITE_ENTRA_API_SCOPE" || { echo "VITE_ENTRA_API_SCOPE is missing"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Build Trackline
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_ENTRA_TENANT_SUBDOMAIN: ${{ secrets.VITE_ENTRA_TENANT_SUBDOMAIN }}
          VITE_ENTRA_SPA_CLIENT_ID: ${{ secrets.VITE_ENTRA_SPA_CLIENT_ID }}
          VITE_ENTRA_API_SCOPE: ${{ secrets.VITE_ENTRA_API_SCOPE }}
        run: npm run build

      - name: Get GitHub ID token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            return await core.getIDToken()
          result-encoding: string

      - name: Deploy Trackline
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_HILL_005B2CD0F }}
          action: "upload"

          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed'

    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_HILL_005B2CD0F }}