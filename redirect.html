<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Trackline authentication</title>
  </head>

  <body>
    <p>Processing authentication...</p>

    <script type="module">
      import {
        broadcastResponseToMainFrame
      } from '@azure/msal-browser/redirect-bridge'

      broadcastResponseToMainFrame().catch((error) => {
        console.error(
          'Authentication redirect error:',
          error
        )
      })
    </script>
  </body>
</html>
